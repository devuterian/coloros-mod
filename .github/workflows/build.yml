name: Korean APK build and release

on:
  push:
    branches: [master, korean-localization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korean-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed Korean source on the localization branch
        if: github.ref == 'refs/heads/korean-localization'
        run: |
          python3 tools/localize_ko.py --apply
          git add app
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: apply complete reviewed Korean UI translation'
            git push origin HEAD:korean-localization
          fi

      - name: Audit translation and unchanged hook logic
        run: |
          python3 tools/localize_ko.py --check --report verification/localization-audit.json
          python3 tools/test_localize_ko.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify APK and public signing certificate
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release assets
        id: version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("localization/ko.json"))["version_name"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ColorOS-Mod-${VERSION}-debug.apk"
          cp verification/localization-audit.json verification/apk-report.json verification/apk-manifest.txt verification/signature.txt dist/
          git archive --format=zip --output="dist/ColorOS-Mod-${VERSION}-source.zip" HEAD

      - name: Enable KVM for read-only UI verification
        if: github.ref == 'refs/heads/master'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Korean screens in light and dark mode
        if: github.ref == 'refs/heads/master'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -prop persist.sys.locale=ko-KR
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/smoke_ui.py

      - name: Package verification evidence and checksums
        run: |
          if [ -d verification/ui ]; then
            (cd verification && zip -qr ../dist/ui-verification.zip ui)
          fi
          (cd dist && sha256sum *.apk *.zip *.json *.txt > SHA256SUMS.txt)

      - name: Upload build and verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coloros-mod-ko-${{ github.run_id }}
          path: |
            dist/*
            verification/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Korean test release in this fork only
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ColorOS Mod ${{ steps.version.outputs.version }} 한국어
          body_path: docs/RELEASE-ko.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/*
